---
# SPDX-License-Identifier: BSD-3-Clause
# SPDX-FileCopyrightText: Copyright © 2019, Sviatoslav Sydorenko

name: 'Test Action 🧪'

on:   # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

# Supersede in-flight runs for the same ref: these are pure tests with
# no publishing side effects, so cancelling stale runs is safe.
concurrency:
  group: "testing-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  devpi-password: 'abcd1234'
  devpi-username: 'root'
  devpi-port: '3141'

  FORCE_COLOR: 1  # Request colored output from CLI tools supporting it
  MYPY_FORCE_COLOR: 1  # MyPy's color enforcement
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_PYTHON_VERSION_WARNING: 1
  PIP_NO_WARN_SCRIPT_LOCATION: 1
  PY_COLORS: 1  # Recognized by the `py` package, dependency of `pytest`
  TOX_PARALLEL_NO_SPINNER: 1
  TOX_TESTENV_PASSENV: >-  # Make tox-wrapped tools see color requests
    FORCE_COLOR
    MYPY_FORCE_COLOR
    NO_COLOR
    PY_COLORS
    PYTEST_THEME
    PYTEST_THEME_MODE

jobs:
  testing:
    name: 'testing (${{ matrix.backend-name }})'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5  # Increase this timeout value as needed

    permissions:
      contents: read  # check out the action being tested

    strategy:
      fail-fast: false
      matrix:
        include:
          # A pinned backend gives a stable baseline that only changes
          # when the pin below is bumped deliberately.
          - backend-name: 'setuptools'
            backend-requires: 'setuptools == 80.4.0'
            backend-module: 'setuptools.build_meta'
          # An unpinned backend deliberately floats to its newest
          # release, so the newest core metadata version is always
          # exercised against the twine pinned in runtime.txt.
          #
          # This leg exists because a pinned twine silently stops
          # accepting distributions once a build backend starts
          # emitting a metadata version it does not know about.
          # Hatchling 1.30 began emitting Metadata-Version 2.5, which
          # the twine pinned at the time rejected, breaking real
          # releases while this workflow stayed green: the setuptools
          # stub above still emits 2.4 and cannot reproduce it.
          - backend-name: 'hatchling'
            backend-requires: 'hatchling'
            backend-module: 'hatchling.build'

    services:
      devpi:
        # Pinned by digest: an unpinned tag lets the registry swap the
        # image contents underneath a run.
        # yamllint disable-line rule:line-length
        image: 'muccg/devpi@sha256:ee3fb337aef6d2d2c560781ee80826eff61b75175820c7585ab71313e2d37a60'
        env:
          DEVPI_PASSWORD: "${{ env.devpi-password }}"
        ports:
          - 3141

    steps:
      - name: 'Check out the action locally'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: 'test'
          # Nothing here pushes back to the repository, so the checkout
          # credential is not needed beyond the clone itself.
          persist-credentials: false

      - name: 'Upgrade pip'
        run: python -m pip install --upgrade pip

      - name: 'Install the packaging-related tools'
        run: python3 -m pip install --upgrade build twine setuptools
        env:
          PIP_CONSTRAINT: 'test/requirements/runtime.txt'

      - name: 'Create the stub package importable directory'
        run: mkdir -pv src/test_package

      - name: 'Populate the stub package `__init__.py`'
        run: echo '__version__ = "0.1"' > src/test_package/__init__.py

      - name: 'Populate the stub package `README.md`'
        run: echo "# Test Package" > README.md

      - name: 'Populate the stub package `pyproject.toml`'
        run: echo "$CONTENTS" > pyproject.toml
        env:
          CONTENTS: |
            [build-system]
            requires = [
              "${{ matrix.backend-requires }}",
            ]
            build-backend = "${{ matrix.backend-module }}"

            [project]
            name = "test-package"
            version = "0.1"
            readme = "README.md"

      - name: 'Build the stub package sdist and wheel distributions'
        # Build isolation resolves the backend from the index, so the
        # unpinned leg picks up its newest release on every run.
        run: python3 -m build

      - name: 'Report the core metadata version produced'
        # Recorded to make metadata drift visible in the log and the job
        # summary. The value rises over time on the unpinned leg; it is
        # the version the pinned twine has to be able to parse.
        env:
          BACKEND_NAME: ${{ matrix.backend-name }}
        run: |
          metadata_version="$(
            python3 -c '
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[0]
          archive = zipfile.ZipFile(wheel)
          entry = next(
              name for name in archive.namelist()
              if name.endswith(".dist-info/METADATA")
          )
          print(archive.read(entry).decode().splitlines()[0])
          '
          )"
          echo "${BACKEND_NAME}: ${metadata_version}"
          echo "- ${BACKEND_NAME}: \`${metadata_version}\`" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 'Register the stub package in devpi'
        run: twine register dist/*.tar.gz
        env:
          TWINE_USERNAME: ${{ env.devpi-username }}
          TWINE_PASSWORD: ${{ env.devpi-password }}
          TWINE_REPOSITORY_URL: >-
            http://localhost:${{
              job.services.devpi.ports['3141']
            }}/${{
              env.devpi-username
            }}/public/

      - name: 'Test the locally checked out action'
        uses: ./test
        env:
          DEBUG: >-
            true
          PATH: utter-nonsense
        with:
          user: ${{ env.devpi-username }}
          password: ${{ env.devpi-password }}
          repository-url: >-
            http://devpi:${{ env.devpi-port }}/${{ env.devpi-username }}/public/

...
