version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
    # Let a release settle before proposing it, so a version that is
    # yanked or quickly superseded is not pulled in immediately.
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
